<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Job Intelligence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Job Intelligence</h1>
            <div id="status" class="status">Ready</div>
        </header>

        <section class="scan-section">
            <div class="form-group">
                <label>Scan for:</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="scanJobs" checked> Jobs
                    </label>
                    <label>
                        <input type="checkbox" id="scanPosts" checked> Posts
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="freshness">Posted within:</label>
                <select id="freshness">
                    <option value="1h">Last 1 hour</option>
                    <option value="6h">Last 6 hours</option>
                    <option value="12h">Last 12 hours</option>
                    <option value="24h" selected>Last 24 hours</option>
                    <option value="3d">Last 3 days</option>
                    <option value="7d">Last 7 days</option>
                </select>
            </div>

            <button id="analyzeBtn" class="btn-primary">
                <span id="btnText">Analyze Page</span>
                <span id="btnLoader" class="loader" style="display: none;"></span>
            </button>

            <button id="scanBtn" class="btn-secondary" type="button">Start Self-Scan</button>

            <details id="profileDetails" style="margin-top: 16px;">
                <summary style="cursor: pointer; font-weight: 600;">🎯 Profile (upload resume + edit)</summary>

                <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="display:block; font-weight:500; margin-bottom:6px;">Upload resume</label>
                        <input id="resumeFile" type="file" accept=".txt,.pdf,.doc,.docx" />
                        <div id="resumeStatus" style="font-size:12px; color:#666; margin-top:6px; display:none;"></div>
                    </div>

                    <button id="parseResumeBtn" class="btn-secondary" type="button">Parse resume</button>

                    <form id="profileForm">
                        <div style="display:flex; flex-direction:column; gap: 10px;">
                            <div>
                                <label for="profileName" style="display:block; font-weight:500; margin-bottom:6px;">Profile Name</label>
                                <input id="profileName" type="text" placeholder="e.g., DevOps Engineer Profile" required style="width:100%; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                            </div>

                            <div>
                                <label for="experienceYears" style="display:block; font-weight:500; margin-bottom:6px;">Years of Experience</label>
                                <input id="experienceYears" type="number" min="0" max="50" step="0.5" value="0" style="width:100%; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                            </div>

                            <div>
                                <label style="display:block; font-weight:500; margin-bottom:6px;">Roles</label>
                                <input id="rolesInput" type="text" placeholder="e.g., DevOps Engineer" style="width:100%; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                                <div style="display:flex; gap:8px; margin-top:8px;">
                                    <button type="button" id="addRoleBtn" class="btn-secondary" style="flex:1;">Add role</button>
                                </div>
                                <div id="rolesTags" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;"></div>
                            </div>

                            <div>
                                <label style="display:block; font-weight:500; margin-bottom:6px;">Skills (strong / working / familiar)</label>

                                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                    <input id="strongSkillInput" type="text" placeholder="Strong (e.g., Docker)" style="flex:1; min-width: 160px; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                                    <button type="button" id="addStrongSkillBtn" class="btn-secondary" style="min-width:120px;">Add</button>
                                </div>

                                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
                                    <input id="workingSkillInput" type="text" placeholder="Working (e.g., Kubernetes)" style="flex:1; min-width: 160px; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                                    <button type="button" id="addWorkingSkillBtn" class="btn-secondary" style="min-width:120px;">Add</button>
                                </div>

                                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
                                    <input id="familiarSkillInput" type="text" placeholder="Familiar (e.g., Terraform)" style="flex:1; min-width: 160px; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                                    <button type="button" id="addFamiliarSkillBtn" class="btn-secondary" style="min-width:120px;">Add</button>
                                </div>

                                <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                                    <div style="font-size:12px; color:#666;">Strong</div>
                                    <div id="strongSkillsTags" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                                </div>
                                <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                                    <div style="font-size:12px; color:#666;">Working</div>
                                    <div id="workingSkillsTags" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                                </div>
                                <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
                                    <div style="font-size:12px; color:#666;">Familiar</div>
                                    <div id="familiarSkillsTags" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                                </div>
                            </div>

                            <div>
                                <label for="locationsInput" style="display:block; font-weight:500; margin-bottom:6px;">Preferred Locations</label>
                                <input id="locationsInput" type="text" placeholder="e.g., Ahmedabad, Remote" style="width:100%; padding:10px 12px; border:1px solid #d0d0d0; border-radius:6px;" />
                                <button type="button" id="addLocationBtn" class="btn-secondary" style="width:100%; margin-top:8px;">Add location</button>
                                <div id="locationsTags" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;"></div>
                            </div>

                            <button type="submit" class="btn-primary" style="margin-top: 6px;">💾 Save Profile</button>
                            <div id="profileFormStatus" style="font-size:12px; color:#666; display:none;"></div>
                        </div>
                    </form>
                </div>
            </details>

        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Results</h2>
                <div id="resultStats" class="stats"></div>
            </div>

            <div id="matchesContainer" class="matches-container"></div>
        </section>

        <footer>
            <a href="../options/profile.html" target="_blank">⚙️ Profile Settings</a>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
