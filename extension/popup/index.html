<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Job Intelligence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Job Intelligence</h1>
            <div id="status" class="status">Ready</div>
        </header>

        <section class="scan-section">
            <div class="form-group">
                <label>Scan for:</label>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="scanJobs" checked> Jobs
                    </label>
                    <label>
                        <input type="checkbox" id="scanPosts" checked> Posts
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="freshness">Posted within:</label>
                <select id="freshness">
                    <option value="1h">Last 1 hour</option>
                    <option value="6h">Last 6 hours</option>
                    <option value="12h">Last 12 hours</option>
                    <option value="24h" selected>Last 24 hours</option>
                    <option value="3d">Last 3 days</option>
                    <option value="7d">Last 7 days</option>
                </select>
            </div>

            <button id="analyzeBtn" class="btn-primary">
                <span id="btnText">Analyze Page</span>
                <span id="btnLoader" class="loader" style="display: none;"></span>
            </button>
        </section>

        <section class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Results</h2>
                <div id="resultStats" class="stats"></div>
            </div>

            <div id="matchesContainer" class="matches-container"></div>
        </section>

        <footer>
            <a href="../options/profile.html" target="_blank">⚙️ Profile Settings</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
